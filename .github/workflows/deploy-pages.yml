name: Build and Deploy WASM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------
      # Install Docker (needed for emscripten build)
      # ---------------------------
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      # ---------------------------
      # Build project
      # ---------------------------
      - name: Build WASM + Elm
        run: |
          make elm.js
          make snake.js

      # ---------------------------
      # Prepare static site
      # ---------------------------
      - name: Assemble site
        run: |
          mkdir dist
          cp snake.js dist/
          cp snake.wasm dist/
          cp elm.js dist/
          cp index.html dist/
          cp style.css dist/
          cp support.js dist/

      # ---------------------------
      # Upload artifact
      # ---------------------------
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
