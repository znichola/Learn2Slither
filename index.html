<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Dojo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="elm.js"></script>
    <script type="text/javascript" src="support.js"></script>
</head>

<body>

    <button id="theme-toggle" class="theme-toggle">Theme: System</button>

    <div class="title-group"><h1>Snake Dojo</h1><commit><a href=https://github.com/znichola/Learn2Slither/commit/14c7ecc>#<span>14c7ecc</span></a></commit><date>2026-08-11 11:08:21 UTC</date></div>


    <div id="elm-node"></div>

    <details>
        <summary>Terminal Output</summary>
        <div id="terminal">Loading WebAssembly...</div>
    </details>

    <script type="text/javascript">
        // Initialize Elm app
        var app = Elm.Main.init({
            node: document.getElementById('elm-node')
        });

        // Elm -> JS: Handle commands from Elm
        app.ports.sendToJs.subscribe(async (payload) => {
            let value;
            if (payload.type === "LOAD_AGENT") {
                loadTextFile((filename, content) => {
                    const text =
                        `LOAD_AGENT_START[\n${content}\n]LOAD_AGENT_END\n`;

                    window.enqueueInput(text);
                    window.sendToWasm(text);

                    termPrint(`[Elm -> WASM] load_agent("${filename}")`, "msg-log");
                });
                return;
            } else if (payload.type == "STEP") {
                value = payload.value;
            } else {
                value = JSON.stringify(payload.value);
            }
            console.log('[Elm→JS]', payload);

            const text = `${payload.type.toUpperCase()}_START[\n${value}\n]${payload.type.toUpperCase()}_END\n`;
            window.enqueueInput(text);
            window.sendToWasm(text);

            if (payload.type === "step") {
                termPrint(`[Elm -> WASM] step(${value})`, 'msg-log');
            }
        });

        const term = document.getElementById("terminal");

        const start_time = Date.now();

        function termPrint(text, className = '') {
            const elapsed = Math.floor((Date.now() - start_time) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;

            const timestamp = `[${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}]`;

            const line = document.createElement('div');
            if (className) line.className = className;

            // Create timestamp span
            const timeSpan = document.createElement('span');
            timeSpan.className = 'msg-time';
            timeSpan.textContent = timestamp + ' ';

            line.appendChild(timeSpan);
            
            // Add the message content
            const contentSpan = document.createElement('span');
            contentSpan.textContent = text;
            contentSpan.className = 'msg-block';
            line.appendChild(contentSpan);

            term.appendChild(line);
            term.scrollTop = term.scrollHeight;

            // Also log to browser console
            console.log(text)
        }

        // Create parser instance
        const parser = new WasmOutputParser(['BOARD', 'LOG', 'ERROR', "RUN_DONE", "SAVE_AGENT", "QTABLE_SIZE", "PUSH_CONFIG"]);

        // Handle parsed messages - send to both terminal and Elm
        parser.onMessage = (message) => {
            // Display in terminal for debugging
            switch (message.type) {
                case 'board':
                    termPrint(`[BOARD]\n${message.content}`, 'msg-board');
                    break;
                case 'log':
                    termPrint(`[LOG] ${message.content}`, 'msg-log');
                    break;
                case 'error':
                    termPrint(`[ERROR] ${message.content}`, 'msg-error');
                    break;
                case 'save_agent':
                    termPrint(`[SAVE_AGENT] ${message.content}`, 'msg-log');
                    saveAgentFile(message.content);
                    break;
                default:
                    termPrint(`[${message.type.toUpperCase()}] ${message.content}`);
            }

            // Send to Elm
            app.ports.receiveFromJs.send({
                type: message.type,
                source: message.source,
                content: message.content
            });
        };
    </script>

    <script type="module">
        // WASM STUFF
        import createModule from "./snake.js";

        // Called by Elm port handler above - pushes chars into the queue
        // and wakes up WASM if it is suspended waiting for input.
        window.enqueueInput = (str) => {
            console.log("called with data to send to the  c++ stdin:", str)
        };


        // Start the WASM module
        createModule({
            noInitialRun: true,
            print: (text) => {
                parser.processStdout(text + '\n');
            },
            printErr: (text) => {
                parser.processStderr(text + '\n');
            }
        }).then((Module) => {
            term.textContent = "";
            termPrint("[SYSTEM] WASM Runtime initialized", 'msg-log');
            Module.callMain([]);

            // Expose Module globally to call functions from Elm
            window.WasmModule = Module;
        });

        // Resolve function stored here while WASM is suspended
        let _wasmResume = null;

        // Call this from anywhere (Elm port handler, button, etc.) to wake WASM
        window.sendToWasm = (text) => {
            const Module = window.WasmModule;
            
            const ptr = Module.stringToNewUTF8(text);
            Module._bridge_deliver(ptr, Module.lengthBytesUTF8(text));
            Module._free(ptr);

            if (Module._pendingResume) {
                const resume = Module._pendingResume;
                Module._pendingResume = null;
                resume();
            }
        };

    </script>

    <script>
        // Theme button
        const themeToggle = document.getElementById('theme-toggle');
        const themes = ['system', 'light', 'dark'];
        let currentThemeIndex = 0;

        themeToggle.addEventListener('click', () => {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            document.body.className = themes[currentThemeIndex]
            themeToggle.textContent = `Theme: ${themes[currentThemeIndex].charAt(0).toUpperCase() + themes[currentThemeIndex].slice(1)}`;
        });
    </script>
</body>

</html>
